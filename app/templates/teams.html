{% extends "base.html" %}
{% block content %}
<div class="page">
    <div class="page-header">
        <h1>🏟️ Team Stats</h1>
        <p>Select a team to see detailed performance breakdown</p>
    </div>

    <div class="controls">
        <div class="select-group">
            <label>Select Team</label>
            <select id="teamSelect" onchange="loadTeam()">
                <option value="">-- Choose a team --</option>
                {% for team in teams %}
                <option value="{{ team }}">{{ team }}</option>
                {% endfor %}
            </select>
        </div>
    </div>

    <div id="teamContent" style="display:none">
        <div class="cards-row">
            <div class="card">
                <div class="card-label">Total Matches</div>
                <div class="card-value" id="totalMatches">-</div>
            </div>
            <div class="card">
                <div class="card-label">Total Wins</div>
                <div class="card-value" id="totalWins">-</div>
            </div>
            <div class="card">
                <div class="card-label">Win Rate</div>
                <div class="card-value" id="winRate">-</div>
            </div>
            <div class="card">
                <div class="card-label">Best Venue</div>
                <div class="card-value" style="font-size:13px;margin-top:8px;" id="bestVenue">-</div>
            </div>
        </div>

        <div class="charts-row">
            <div class="chart-box full">
                <div class="chart-title">Season-wise Performance</div>
                <canvas id="seasonChart" height="80"></canvas>
            </div>
        </div>
    </div>

    <div class="loading" id="loading" style="display:none">Loading team stats...</div>
</div>

<script>
let seasonChartInstance = null;

async function loadTeam() {
    const team = document.getElementById('teamSelect').value;
    if (!team) return;

    document.getElementById('loading').style.display = 'block';
    document.getElementById('teamContent').style.display = 'none';

    const res = await fetch(`/api/team-stats?team=${encodeURIComponent(team)}`);
    const data = await res.json();

    document.getElementById('totalMatches').innerText = data.total;
    document.getElementById('totalWins').innerText = data.wins;
    document.getElementById('winRate').innerText = data.win_pct + '%';
    document.getElementById('bestVenue').innerText = data.best_venue;

    if (seasonChartInstance) seasonChartInstance.destroy();

    seasonChartInstance = new Chart(document.getElementById('seasonChart'), {
        type: 'bar',
        data: {
            labels: data.seasons,
            datasets: [
                {
                    label: 'Played',
                    data: data.played,
                    backgroundColor: 'rgba(255,255,255,0.1)',
                    borderRadius: 4
                },
                {
                    label: 'Won',
                    data: data.won,
                    backgroundColor: 'rgba(240,165,0,0.8)',
                    borderRadius: 4
                }
            ]
        },
        options: {
            responsive: true,
            plugins: {
                legend: { labels: { color: '#888' } }
            },
            scales: {
                x: { ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } },
                y: { ticks: { color: '#888' }, grid: { color: 'rgba(255,255,255,0.05)' } }
            }
        }
    });

    document.getElementById('loading').style.display = 'none';
    document.getElementById('teamContent').style.display = 'block';
}
</script>
{% endblock %}
