<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Analytics | {{ title }}</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0a0a14;
            --surface: #12121f;
            --surface2: #1a1a2e;
            --border: rgba(255,255,255,0.08);
            --accent: #f0a500;
            --accent2: #e85d04;
            --text: #ffffff;
            --muted: #888;
            --success: #00c896;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

        /* NAV */
        nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 64px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .nav-brand {
            font-size: 20px;
            font-weight: 800;
            background: linear-gradient(135deg, #f0a500, #e85d04);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-decoration: none;
        }
        .nav-links { display: flex; gap: 4px; }
        .nav-links a {
            padding: 8px 16px;
            border-radius: 8px;
            color: var(--muted);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.2s;
        }
        .nav-links a:hover { color: var(--text); background: rgba(255,255,255,0.06); }
        .nav-links a.active { color: var(--accent); background: rgba(240,165,0,0.1); }

        /* PAGE */
        .page { padding: 40px; max-width: 1200px; margin: 0 auto; }
        .page-header { margin-bottom: 32px; }
        .page-header h1 { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
        .page-header p { color: var(--muted); font-size: 14px; }

        /* CARDS */
        .cards-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 32px; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
        }
        .card-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .card-value { font-size: 28px; font-weight: 800; color: var(--accent); }
        .card-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }

        /* CHART CONTAINERS */
        .charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }
        .chart-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
        }
        .chart-box.full { grid-column: span 2; }
        .chart-title { font-size: 14px; font-weight: 700; margin-bottom: 20px; color: var(--text); }

        /* TABLE */
        .table-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .table-box table { width: 100%; border-collapse: collapse; }
        .table-box th {
            background: var(--surface2);
            padding: 12px 16px;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-align: left;
        }
        .table-box td { padding: 12px 16px; font-size: 13px; border-top: 1px solid var(--border); }
        .table-box tr:hover td { background: rgba(255,255,255,0.03); }
        .rank { color: var(--accent); font-weight: 700; }

        /* SELECTS */
        .controls { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; }
        .select-group { display: flex; flex-direction: column; gap: 6px; }
        .select-group label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
        select {
            padding: 10px 14px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-size: 13px;
            outline: none;
            cursor: pointer;
            min-width: 200px;
        }
        select:focus { border-color: var(--accent); }
        select option { background: var(--surface2); }

        /* BUTTON */
        .btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            border: none;
            border-radius: 10px;
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            align-self: flex-end;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(240,165,0,0.3); }

        /* BADGE */
        .badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }
        .badge-gold { background: rgba(240,165,0,0.15); color: var(--accent); }
        .badge-green { background: rgba(0,200,150,0.15); color: var(--success); }

        /* LOADING */
        .loading { text-align: center; padding: 40px; color: var(--muted); font-size: 14px; }
    </style>
</head>
<body>
<nav>
    <a class="nav-brand" href="/">🏏 IPL Analytics</a>
    <div class="nav-links">
        <a href="/" class="{{ 'active' if active == 'home' }}">Home</a>
        <a href="/teams" class="{{ 'active' if active == 'teams' }}">Team Stats</a>
        <a href="/players" class="{{ 'active' if active == 'players' }}">Players</a>
        <a href="/h2h" class="{{ 'active' if active == 'h2h' }}">Head-to-Head</a>
        <a href="/predictor" class="{{ 'active' if active == 'predictor' }}">Predictor</a>
        <a href="/auction" class="{{ 'active' if active == 'auction' }}">🤖 Auction AI</a>
    </div>
</nav>
{% block content %}{% endblock %}
</body>
</html>
