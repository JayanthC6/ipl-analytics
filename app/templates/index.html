<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Match Predictor</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1a; color: #fff; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .container { background: #1a1a2e; padding: 40px; border-radius: 16px; width: 480px; box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
        h1 { text-align: center; color: #f0a500; margin-bottom: 8px; font-size: 24px; }
        p.subtitle { text-align: center; color: #888; margin-bottom: 30px; font-size: 13px; }
        .form-group { margin-bottom: 16px; }
        label { display: block; margin-bottom: 6px; color: #ccc; font-size: 13px; }
        select { width: 100%; padding: 10px 14px; background: #0f0f1a; border: 1px solid #333; border-radius: 8px; color: #fff; font-size: 14px; outline: none; }
        select:focus { border-color: #f0a500; }
        button { width: 100%; padding: 14px; background: #f0a500; border: none; border-radius: 8px; color: #0f0f1a; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
        button:hover { background: #d4920a; }
        .result { margin-top: 24px; padding: 20px; background: #0f0f1a; border-radius: 10px; text-align: center; display: none; }
        .result h2 { color: #f0a500; font-size: 20px; margin-bottom: 6px; }
        .result p { color: #aaa; font-size: 14px; }
        .error { color: #ff4d4d; margin-top: 10px; text-align: center; font-size: 13px; }
    </style>
</head>
<body>
<div class="container">
    <h1>🏏 IPL Match Predictor</h1>
    <p class="subtitle">Predict match outcomes using machine learning</p>

    <div class="form-group">
        <label>Team 1</label>
        <select id="team1">
            {% for team in teams %}<option value="{{ team }}">{{ team }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Team 2</label>
        <select id="team2">
            {% for team in teams %}<option value="{{ team }}">{{ team }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Venue</label>
        <select id="venue">
            {% for venue in venues %}<option value="{{ venue }}">{{ venue }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Toss Winner</label>
        <select id="toss_winner">
            {% for team in teams %}<option value="{{ team }}">{{ team }}</option>{% endfor %}
        </select>
    </div>
    <div class="form-group">
        <label>Toss Decision</label>
        <select id="toss_decision">
            <option value="bat">Bat</option>
            <option value="field">Field</option>
        </select>
    </div>

    <button onclick="predict()">Predict Winner</button>
    <div class="result" id="result">
        <h2 id="winner"></h2>
        <p id="confidence"></p>
    </div>
    <div class="error" id="error"></div>
</div>

<script>
async function predict() {
    const payload = {
        team1: document.getElementById('team1').value,
        team2: document.getElementById('team2').value,
        venue: document.getElementById('venue').value,
        toss_winner: document.getElementById('toss_winner').value,
        toss_decision: document.getElementById('toss_decision').value
    };

    const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
    });

    const data = await res.json();
    document.getElementById('error').innerText = '';

    if (data.error) {
        document.getElementById('error').innerText = data.error;
        document.getElementById('result').style.display = 'none';
    } else {
        document.getElementById('winner').innerText = '🏆 ' + data.winner + ' wins!';
        document.getElementById('confidence').innerText = 'Model confidence: ' + data.confidence + '%';
        document.getElementById('result').style.display = 'block';
    }
}
</script>
</body>
</html>
